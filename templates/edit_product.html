
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | WarehouseIQ</title>
     <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include '_header.html' %}
    <h1>Edit Product</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Stock Keeping Unit</label>
        <input name="sku" maxlength="50" value="{{ product.sku }}" required>

        <label>Product Name</label>
        <input name="name" maxlength="120" value="{{ product.name }}" required>

        <label>Category</label>
        <input name="category" maxlength="80"
               value="{{ product.category }}" required>

        <label>Unit</label>
        <input name="unit" maxlength="20" value="{{ product.unit }}" required>

        <label>Purchase Price (₹)</label>
        <input name="purchase_price" type="number" min="0"
               step="0.01" max="99999999.99"
               value="{{ product.purchase_price }}" required>

        <label>Selling Price (₹)</label>
        <input name="selling_price" type="number" min="0"
               step="0.01" max="99999999.99"
               value="{{ product.selling_price }}" required>

        <label>Quantity</label>
        <input name="quantity" type="number" min="0"
               step="1" value="{{ product.quantity }}" required>

        <label>Reorder Level</label>
        <input name="reorder_level" type="number" min="0"
               step="1" value="{{ product.reorder_level }}" required>

        <button type="submit">Update Product</button>
    </form>

    <a href="{{ url_for('products') }}">Back to Products</a>
</body>
</html>
