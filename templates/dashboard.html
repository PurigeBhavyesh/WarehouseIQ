
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | WarehouseIQ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include '_header.html' %}

    <main>
        <section class="welcome">
            <h2>Welcome {{ username }}</h2>
            <p>Here is an overview of your inventory.</p>
        </section>

        <section class="stats">
            <div class="card">
                <h3>Active Products</h3>
                <p class="stat-number">{{ product_count }}</p>
            </div>

            <div class="card">
                <h3>Low Stock Products</h3>
                <p class="stat-number">{{ low_stock_count }}</p>
            </div>
        </section>

        <section class="actions">
            <a href="{{ url_for('products') }}" class="action-link">
                View Products
            </a>

            <a href="{{ url_for('add_product') }}" class="action-link">
                Add Product
            </a>
        </section>
    </main>

</body>
</html>
